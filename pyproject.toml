[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-mas"
version = "0.1.0"
description = "Academic smart-building HVAC multi-agent simulator"
requires-python = ">=3.11,<3.14"
dependencies = [
  "spade==4.1.4", "pymongo>=4.13,<5", "dnspython>=2.6,<3", "fastapi", "uvicorn[standard]",
  "pydantic>=2", "pydantic-settings", "pyyaml", "httpx"
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
